  <desc id="desc">DigiTantra wordmark with a purple to teal gradient on a dark background.</desc>
  <defs>
    <linearGradient id="footer-logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A976FF" />
      <stop offset="38%" stop-color="#8B5CF6" />
      <stop offset="72%" stop-color="#57D4C6" />
      <stop offset="100%" stop-color="#1FE29A" />
